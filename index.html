<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聖馬太升中面試 AI 練習系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    .recording-pulse { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans p-2">
  <!-- Nav Bar -->
  <nav class="bg-indigo-600 text-white shadow-md p-4 rounded-xl mb-4">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <i data-lucide="graduation-cap" class="w-7 h-7"></i>
        <h1 class="text-xl font-bold tracking-wide">聖馬太升中面試 AI 練習系統</h1>
      </div>
      <div class="flex items-center gap-2">
        <div id="connectionStatus" class="flex items-center gap-1.5 text-xs bg-indigo-700 px-3 py-1.5 rounded-full">
          <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
          <span id="statusText">資料庫同步中</span>
        </div>
        <button id="modeToggleBtn" onclick="toggleModePrompt()" class="bg-white/10 hover:bg-white/20 text-white px-3 py-1.5 rounded-lg text-sm flex items-center gap-1 transition">
          <i data-lucide="user-cog" class="w-4 h-4"></i>
          <span id="modeText">教師登入</span>
        </button>
      </div>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto space-y-4 pb-12">
    <!-- Student View -->
    <div id="studentView" class="space-y-4 hidden">
      <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-4 flex items-center justify-between">
        <div>
          <h2 class="font-bold text-indigo-900 text-lg">🎓 聖馬太學生練習區</h2>
          <p class="text-xs text-indigo-700">選擇題目後，可以使用語音或文字回答，也可點擊「🔊 語音朗讀」收聽示範！</p>
        </div>
        <span class="text-xs bg-indigo-200 text-indigo-800 px-2.5 py-1 rounded-md font-medium" id="questionCountBadge">0 道題目</span>
      </div>

      <!-- Question Selection & Band Filter -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4">
        <!-- Band 篩選按鈕區 -->
        <div class="flex flex-wrap items-center gap-2 border-b border-slate-100 pb-3">
          <span class="text-xs font-bold text-slate-500 mr-1">組別分類：</span>
          <button onclick="setBandFilter('ALL')" id="filterBtnALL" class="band-filter-btn px-3 py-1 rounded-lg text-xs font-bold transition bg-indigo-600 text-white shadow-sm">
            全部題目
          </button>
          <button onclick="setBandFilter('Band 1')" id="filterBtnBand1" class="band-filter-btn px-3 py-1 rounded-lg text-xs font-bold transition bg-slate-100 text-slate-600 hover:bg-slate-200">
            Band 1
          </button>
          <button onclick="setBandFilter('Band 2')" id="filterBtnBand2" class="band-filter-btn px-3 py-1 rounded-lg text-xs font-bold transition bg-slate-100 text-slate-600 hover:bg-slate-200">
            Band 2
          </button>
          <button onclick="setBandFilter('Band 3')" id="filterBtnBand3" class="band-filter-btn px-3 py-1 rounded-lg text-xs font-bold transition bg-slate-100 text-slate-600 hover:bg-slate-200">
            Band 3
          </button>
        </div>

        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
          <label class="text-sm font-semibold text-slate-600">選擇面試題目：</label>
          <select id="questionSelect" onchange="selectQuestion(this.value)" class="w-full sm:w-auto flex-1 bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="">載入中...</option>
          </select>
        </div>

        <div id="currentQuestionBox" class="hidden space-y-3 pt-1">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span id="qBandBadge" class="px-2.5 py-0.5 rounded text-xs font-bold bg-indigo-100 text-indigo-700">BAND 1</span>
              <span id="qLangBadge" class="px-2.5 py-0.5 rounded text-xs font-bold bg-emerald-100 text-emerald-700">中文</span>
            </div>
            <button onclick="toggleSampleAnswer()" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 flex items-center gap-1 bg-indigo-50 hover:bg-indigo-100 px-2.5 py-1 rounded-lg transition">
              <i data-lucide="lightbulb" class="w-3.5 h-3.5"></i>
              <span id="sampleBtnText">觀看 AI 建議答案</span>
            </button>
          </div>
          <h3 id="currentQuestionTitle" class="text-lg font-bold text-slate-800 leading-snug">--</h3>
          <p id="currentQuestionDesc" class="text-xs text-slate-500 bg-slate-50 p-2.5 rounded-lg border border-slate-100">--</p>

          <div id="sampleAnswerBox" class="hidden bg-amber-50/90 border border-amber-200 rounded-xl p-4 space-y-3 transition shadow-sm">
            <div class="flex items-center justify-between border-b border-amber-200 pb-2">
              <div class="flex items-center gap-1.5 text-amber-900 font-bold text-xs">
                <i data-lucide="sparkles" class="w-4 h-4 text-amber-600"></i>
                <span>AI 面試官建議答案與答題框架</span>
              </div>
              <button onclick="speakText('sampleAnswerContent')" id="speakSampleBtn" class="bg-amber-600 hover:bg-amber-700 text-white text-xs px-2.5 py-1 rounded-lg font-semibold flex items-center gap-1 transition shadow-sm">
                <i data-lucide="volume-2" class="w-3.5 h-3.5"></i> 朗讀建議答案
              </button>
            </div>
            <div id="sampleAnswerContent" class="text-xs text-amber-950 leading-relaxed whitespace-pre-wrap">--</div>
          </div>
        </div>
      </div>

      <!-- Answer Input Area -->
      <div id="answerArea" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4">
        <h3 class="font-bold text-slate-700 flex items-center gap-2 text-sm">
          <i data-lucide="message-square" class="w-4 h-4 text-indigo-600"></i> 作答區域
        </h3>

        <div class="space-y-2">
          <textarea id="studentAnswer" rows="4" class="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-700 text-sm leading-relaxed" placeholder="請輸入你的答案，或點擊下方「語音輸入」開始說話..."></textarea>
          
          <div class="flex flex-wrap items-center justify-between gap-3 pt-1">
            <button id="micBtn" onclick="toggleVoiceRecognition()" class="flex items-center gap-2 bg-rose-500 hover:bg-rose-600 text-white px-4 py-2 rounded-xl font-medium text-xs transition shadow-sm">
              <i data-lucide="mic" class="w-4 h-4"></i>
              <span id="micBtnText">語音輸入</span>
            </button>
            <button onclick="clearAnswer()" class="text-slate-400 hover:text-slate-600 text-xs px-2 py-1">清除內容</button>
          </div>
        </div>

        <button id="submitBtn" onclick="submitAnswerForAI()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition shadow-md">
          <i data-lucide="sparkles" class="w-4 h-4"></i> 提交並進行深度 AI 分析
        </button>
      </div>

      <!-- AI Feedback Result -->
      <div id="aiResultBox" class="hidden bg-white rounded-xl shadow-md border border-indigo-100 p-5 space-y-3">
        <div class="flex justify-between items-center border-b border-slate-100 pb-2">
          <h3 class="font-bold text-base text-slate-800 flex items-center gap-2">
            <i data-lucide="bot" class="w-5 h-5 text-indigo-600"></i> AI 面試官深度分析點評
          </h3>
          <div class="flex items-center gap-2">
            <button onclick="speakText('aiFeedbackContent')" id="speakFeedbackBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-2.5 py-1 rounded-lg font-semibold flex items-center gap-1 transition shadow-sm">
              <i data-lucide="volume-2" class="w-3.5 h-3.5"></i> 朗讀評語與範例
            </button>
            <span class="bg-indigo-50 text-indigo-700 text-xs font-semibold px-2.5 py-1 rounded-md hidden sm:inline-block">附詳細高分作答例子</span>
          </div>
        </div>
        <div id="aiFeedbackContent" class="text-sm text-slate-700 leading-relaxed whitespace-pre-wrap bg-slate-50 p-4 rounded-xl border border-slate-200">
          分析中...
        </div>
      </div>
    </div>

    <!-- Teacher View -->
    <div id="teacherView" class="hidden space-y-4">
      <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 flex justify-between items-center">
        <div>
          <h2 class="font-bold text-amber-900 text-base flex items-center gap-2">
            <i data-lucide="shield-check" class="w-5 h-5"></i> 教師管理後台
          </h2>
          <p class="text-xs text-amber-700">您可以管理題目、修改教師/學生密碼或批量匯入題目。</p>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="openStudentPasswordModal()" class="bg-white border border-amber-300 text-amber-800 hover:bg-amber-100 text-xs font-semibold px-3 py-1.5 rounded-lg transition">修改學生密碼</button>
          <button onclick="openPasswordModal()" class="bg-white border border-amber-300 text-amber-800 hover:bg-amber-100 text-xs font-semibold px-3 py-1.5 rounded-lg transition">修改教師密碼</button>
          <button onclick="exitTeacherMode()" class="bg-amber-600 text-white hover:bg-amber-700 text-xs font-semibold px-3 py-1.5 rounded-lg transition">返回學生模式</button>
        </div>
      </div>

      <!-- Question Controls -->
      <div class="flex flex-wrap items-center justify-between gap-3">
        <h3 class="font-bold text-slate-700 text-base">題庫管理 (<span id="teacherQCount">0</span>)</h3>
        <div class="flex items-center gap-2">
          <button onclick="openBatchModal()" class="bg-indigo-50 border border-indigo-200 text-indigo-700 hover:bg-indigo-100 px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition">
            <i data-lucide="layers" class="w-4 h-4"></i> 批量/AI生成
          </button>
          <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 transition shadow-sm">
            <i data-lucide="plus" class="w-4 h-4"></i> 單條新增
          </button>
        </div>
      </div>

      <div id="teacherQuestionList" class="space-y-2.5"></div>
    </div>
  </main>

  <!-- Student Login Modal -->
  <div id="studentLoginModal" class="fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl text-center">
      <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto">
        <i data-lucide="lock" class="w-6 h-6"></i>
      </div>
      <div>
        <h3 class="font-bold text-slate-800 text-lg">聖馬太學生登入驗證</h3>
        <p class="text-xs text-slate-500 mt-1">請輸入老師提供的學生練習密碼以進入系統。</p>
      </div>
      <input type="password" id="studentPwdInput" class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none text-center tracking-widest" placeholder="請輸入學生密碼" onkeypress="if(event.key==='Enter') verifyStudentPassword()">
      <button onclick="verifyStudentPassword()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-bold text-sm shadow-md transition">
        進入練習系統
      </button>
    </div>
  </div>

  <!-- Add/Edit Question Modal -->
  <div id="qModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-5 space-y-3 shadow-2xl">
      <h3 id="modalTitle" class="font-bold text-slate-800 text-base">新增問題</h3>
      <input type="hidden" id="editKey">
      
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">組別 (Band)</label>
          <select id="qBand" class="w-full border border-slate-300 rounded-lg p-2 text-xs">
            <option value="Band 1">Band 1</option>
            <option value="Band 2">Band 2</option>
            <option value="Band 3">Band 3</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">語言</label>
          <select id="qLang" class="w-full border border-slate-300 rounded-lg p-2 text-xs">
            <option value="中文">中文</option>
            <option value="English">English</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">題目內容 *</label>
        <input type="text" id="qTitleInput" class="w-full border border-slate-300 rounded-lg p-2 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="例如：請簡單介紹一下你自己。">
      </div>

      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-xs font-semibold text-slate-600">答題提示 / AI 參考答案 (可選)</label>
          <button type="button" onclick="teacherGenerateAiAnswer()" id="teacherAiGenBtn" class="text-xs text-indigo-600 hover:text-indigo-800 font-bold flex items-center gap-1 bg-indigo-50 hover:bg-indigo-100 px-2 py-0.5 rounded transition">
            <i data-lucide="sparkles" class="w-3 h-3"></i> AI 生成詳細參考答案
          </button>
        </div>
        <textarea id="qDescInput" rows="4" class="w-full border border-slate-300 rounded-lg p-2 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="可手動輸入提示，或點擊右上角按鈕讓 AI 自動生成詳細參考答案與答題切入點..."></textarea>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeModal('qModal')" class="px-3 py-1.5 text-slate-500 hover:text-slate-700 text-xs font-semibold">取消</button>
        <button onclick="saveQuestion()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded-xl text-xs font-bold shadow">儲存</button>
      </div>
    </div>
  </div>

  <!-- Batch Add Modal -->
  <div id="batchModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-xl w-full p-5 space-y-3 shadow-2xl">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-slate-800 text-base">批量新增 / AI 生成題目</h3>
        <button onclick="generateAiQuestions()" id="aiGenBtn" class="bg-gradient-to-r from-indigo-500 to-purple-600 hover:opacity-90 text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 shadow">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> AI 生成小六題目
        </button>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">預設組別</label>
          <select id="batchBand" class="w-full border border-slate-300 rounded-lg p-2 text-xs">
            <option value="Band 1">Band 1</option>
            <option value="Band 2">Band 2</option>
            <option value="Band 3">Band 3</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">預設語言</label>
          <select id="batchLang" class="w-full border border-slate-300 rounded-lg p-2 text-xs">
            <option value="中文">中文</option>
            <option value="English">English</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">題目列表 (每行一道題)</label>
        <textarea id="batchInput" rows="5" class="w-full border border-slate-300 rounded-lg p-2 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="請你介紹一本你最喜歡的書。&#10;如果你獲得一筆獎學金，你會如何使用？"></textarea>
      </div>

      <div class="flex justify-end gap-2">
        <button onclick="closeModal('batchModal')" class="px-3 py-1.5 text-slate-500 hover:text-slate-700 text-xs font-semibold">取消</button>
        <button onclick="saveBatchQuestions()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded-xl text-xs font-bold shadow">確認匯入</button>
      </div>
    </div>
  </div>

  <!-- Teacher Password Modal -->
  <div id="pwdModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-3 shadow-2xl">
      <h3 id="pwdTitle" class="font-bold text-slate-800 text-base">教師身分驗證</h3>
      <input type="password" id="pwdInput" class="w-full border border-slate-300 rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-indigo-500" placeholder="請輸入教師密碼" onkeypress="if(event.key==='Enter') verifyPassword()">
      <div class="flex justify-end gap-2">
        <button onclick="closeModal('pwdModal')" class="px-3 py-1.5 text-slate-500 hover:text-slate-700 text-xs font-semibold">取消</button>
        <button id="pwdSubmitBtn" onclick="verifyPassword()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded-xl text-xs font-bold shadow">確認</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: 'AIzaSyBr9HlHUsaN-hsE0IZ3iE3ZL94wQtfiPkw',
      authDomain: 'school-interview-system-33a69.firebaseapp.com',
      databaseURL: 'https://school-interview-system-33a69-default-rtdb.firebaseio.com',
      projectId: 'school-interview-system-33a69',
      storageBucket: 'school-interview-system-33a69.firebasestorage.app',
      messagingSenderId: '476705555407',
      appId: '1:476705555407:web:3cfd4e809ce7d5e3e048ba'
    };

    let db = null;
    let questions = {};
    let currentQKey = null;
    let isTeacher = false;
    let teacherPassword = '1234';
    let studentPassword = 'stmatthew';
    let currentBandFilter = 'ALL';
    let recognition = null;
    let isRecording = false;

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initFirebase();
      setupSpeechRecognition();
      checkStudentAuth();
    });

    // 語音朗讀 (Text-to-Speech)
    function speakText(elementId) {
      if (!('speechSynthesis' in window)) {
        alert('您的瀏覽器不支援語音朗讀功能。');
        return;
      }

      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        return;
      }

      const text = document.getElementById(elementId).innerText;
      if (!text || text === '--' || text.includes('分析中')) return;

      const utterance = new SpeechSynthesisUtterance(text);
      const q = questions[currentQKey];

      if (q && q.lang === 'English') {
        utterance.lang = 'en-US';
      } else {
        utterance.lang = 'zh-HK';
      }
      utterance.rate = 0.9;

      window.speechSynthesis.speak(utterance);
    }

    function checkStudentAuth() {
      const isStudentLoggedIn = sessionStorage.getItem('student_authed');
      if (isStudentLoggedIn === 'true') {
        document.getElementById('studentLoginModal').classList.add('hidden');
        document.getElementById('studentView').classList.remove('hidden');
      } else {
        document.getElementById('studentLoginModal').classList.remove('hidden');
        document.getElementById('studentView').classList.add('hidden');
      }
    }

    function verifyStudentPassword() {
      const inputPwd = document.getElementById('studentPwdInput').value.trim();
      if (inputPwd === studentPassword) {
        sessionStorage.setItem('student_authed', 'true');
        document.getElementById('studentLoginModal').classList.add('hidden');
        document.getElementById('studentView').classList.remove('hidden');
      } else {
        alert('學生登入密碼不正確！請向老師查詢。');
      }
    }

    function initFirebase() {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        db = firebase.database();
        
        db.ref('questions').on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            questions = data;
          } else {
            seedDefaultQuestions();
          }
          renderQuestions();
          document.getElementById('connectionStatus').classList.remove('bg-amber-600');
          document.getElementById('connectionStatus').classList.add('bg-indigo-700');
          document.getElementById('statusText').innerText = '資料庫同步中';
        }, (err) => {
          console.warn('Firebase Error:', err);
          fallbackLocalMode();
        });

        db.ref('teacher_password').on('value', (snapshot) => {
          if (snapshot.exists()) teacherPassword = snapshot.val();
        });

        db.ref('student_password').on('value', (snapshot) => {
          if (snapshot.exists()) studentPassword = snapshot.val();
        });

      } catch (e) {
        console.warn('Firebase Config Error:', e);
        fallbackLocalMode();
      }
    }

    function fallbackLocalMode() {
      document.getElementById('connectionStatus').classList.remove('bg-indigo-700');
      document.getElementById('connectionStatus').classList.add('bg-amber-600');
      document.getElementById('statusText').innerText = '離線/單機模式';
      
      const localQ = localStorage.getItem('local_questions');
      if (localQ) {
        questions = JSON.parse(localQ);
      } else {
        seedDefaultQuestions();
      }

      const localStudentPwd = localStorage.getItem('student_password');
      if (localStudentPwd) studentPassword = localStudentPwd;

      renderQuestions();
    }

    function seedDefaultQuestions() {
      const defaults = {
        'q1': { title: '請簡單介紹一下你自己的興趣與優點。', desc: '著重說明自己的獨特個人特色、閱讀偏好或課外活動。', band: 'Band 1', lang: '中文' },
        'q2': { title: 'If you encounter a difficult problem during group project, how will you solve it?', desc: 'Explain teamwork and problem-solving skills clearly.', band: 'Band 1', lang: 'English' },
        'q3': { title: '你平時最喜歡的一門科目是什麼？為什麼？', desc: '舉出具體的學習實例說明理由。', band: 'Band 2', lang: '中文' }
      };
      questions = defaults;
      syncQuestions();
    }

    function syncQuestions() {
      if (db) db.ref('questions').set(questions);
      localStorage.setItem('local_questions', JSON.stringify(questions));
      renderQuestions();
    }

    function setBandFilter(band) {
      currentBandFilter = band;
      
      document.querySelectorAll('.band-filter-btn').forEach(btn => {
        btn.classList.remove('bg-indigo-600', 'text-white', 'shadow-sm');
        btn.classList.add('bg-slate-100', 'text-slate-600');
      });

      const activeBtnId = band === 'ALL' ? 'filterBtnALL' : `filterBtn${band.replace(' ', '')}`;
      const activeBtn = document.getElementById(activeBtnId);
      if (activeBtn) {
        activeBtn.classList.remove('bg-slate-100', 'text-slate-600');
        activeBtn.classList.add('bg-indigo-600', 'text-white', 'shadow-sm');
      }

      renderQuestions();
    }

    function renderQuestions() {
      const select = document.getElementById('questionSelect');
      const teacherList = document.getElementById('teacherQuestionList');
      select.innerHTML = '<option value="">-- 請選擇題目 --</option>';
      teacherList.innerHTML = '';

      const keys = Object.keys(questions);
      document.getElementById('teacherQCount').innerText = keys.length;

      let filteredKeys = keys;
      if (currentBandFilter !== 'ALL') {
        filteredKeys = keys.filter(k => questions[k].band === currentBandFilter);
      }

      document.getElementById('questionCountBadge').innerText = `${filteredKeys.length} 道題目`;

      filteredKeys.forEach((key) => {
        const q = questions[key];
        const opt = document.createElement('option');
        opt.value = key;
        opt.innerText = `[${q.band}][${q.lang}] ${q.title}`;
        select.appendChild(opt);
      });

      keys.forEach((key) => {
        const q = questions[key];
        const card = document.createElement('div');
        card.className = 'bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2';
        card.innerHTML = `
          <div class="space-y-1">
            <div class="flex items-center gap-2">
              <span class="text-xs px-2 py-0.5 rounded font-bold bg-indigo-100 text-indigo-700">${q.band}</span>
              <span class="text-xs px-2 py-0.5 rounded font-bold bg-emerald-100 text-emerald-700">${q.lang}</span>
              <h4 class="font-bold text-slate-800 text-xs sm:text-sm">${q.title}</h4>
            </div>
            ${q.desc ? `<p class="text-xs text-slate-500">${q.desc}</p>` : ''}
          </div>
          <div class="flex items-center gap-2 self-end sm:self-center">
            <button onclick="editQuestion('${key}')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-2.5 py-1 rounded-lg transition font-medium">編輯</button>
            <button onclick="deleteQuestion('${key}')" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 px-2.5 py-1 rounded-lg transition font-medium">刪除</button>
          </div>
        `;
        teacherList.appendChild(card);
      });

      if (currentQKey && questions[currentQKey] && (currentBandFilter === 'ALL' || questions[currentQKey].band === currentBandFilter)) {
        select.value = currentQKey;
      } else {
        selectQuestion('');
      }
    }

    function selectQuestion(key) {
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      currentQKey = key;
      const box = document.getElementById('currentQuestionBox');
      const answerArea = document.getElementById('answerArea');
      
      if (!key || !questions[key]) {
        box.classList.add('hidden');
        answerArea.classList.add('hidden');
        return;
      }

      const q = questions[key];
      document.getElementById('qBandBadge').innerText = q.band;
      document.getElementById('qLangBadge').innerText = q.lang;
      document.getElementById('currentQuestionTitle').innerText = q.title;
      document.getElementById('currentQuestionDesc').innerText = q.desc || '無補充說明';
      
      document.getElementById('sampleAnswerBox').classList.add('hidden');
      document.getElementById('sampleBtnText').innerText = '觀看 AI 建議答案';
      
      box.classList.remove('hidden');
      answerArea.classList.remove('hidden');
      document.getElementById('aiResultBox').classList.add('hidden');
    }

    function toggleSampleAnswer() {
      const sampleBox = document.getElementById('sampleAnswerBox');
      const btnText = document.getElementById('sampleBtnText');
      const isHidden = sampleBox.classList.contains('hidden');

      if (isHidden) {
        const q = questions[currentQKey];
        const isEnglish = q.lang === "English";
        let sampleContent = "";

        if (q.desc && q.desc.trim().length > 0 && q.desc.includes("示範答案")) {
          sampleContent = q.desc;
        } else {
          sampleContent = generateDetailedSample(q.title, q.band, isEnglish);
        }

        document.getElementById('sampleAnswerContent').innerText = sampleContent;
        sampleBox.classList.remove('hidden');
        btnText.innerText = '隱藏建議答案';
      } else {
        sampleBox.classList.add('hidden');
        btnText.innerText = '觀看 AI 建議答案';
        if (window.speechSynthesis) window.speechSynthesis.cancel();
      }
    }

    // 🌟 動態分類語意生成引擎：依題目關鍵字自動匹配最佳高分範本
    function generateDetailedSample(title, band, isEnglish) {
      const t = title.toLowerCase();

      // 1. 閱讀與書籍類
      if (t.includes('書') || t.includes('閱讀') || t.includes('book') || t.includes('read') || t.includes('作者')) {
        if (isEnglish) {
          return `📌 【Recommended Structure (PREP Model)】:\n• Point: State your favorite book clearly.\n• Reason: Explain the core theme or takeaway.\n• Example: Connect a story event to your own life.\n• Point: Summarize how reading enriches your learning.\n\n📝 【${band} High-Score Sample Answer】:\n"Thank you for this question. My favorite book is 'The Little Prince'. The central message that 'what is essential is invisible to the eye' resonated deeply with me. During a group project last year, I learned to look past minor conflicts and understand my classmates' perspectives, much like the Little Prince learned to care for his rose. Reading this book taught me empathy and patience, qualities I hope to bring to your school."`;
        } else {
          return `📌 【推薦答題結構 (STAR 原則)】：\n• S (情境)：點出你最喜歡的一本書及其核心主題。\n• T (任務)：說明書中哪一段情節或觀點對你啟發最深。\n• A (行動)：具體分享你如何將書中道理應用在日常學習或生活中。\n• R (結果)：總結閱讀對你個人性格與思維的正面提升。\n\n📝 【${band} 高分作答範例】：\n「各位面試官老師好！針對『${title}』這個題目，我最喜愛的一本書是《夏洛的網》。這本書講述了真摯的友誼與承諾的力量。記得在小五參與校際接力賽時，我們隊伍起初因落後而士氣低落。我聯想到書中夏洛默默支持朋友的精神，便主動鼓勵隊友堅持到底，最終我們獲得了季軍。這本書讓我明白到承諾與團隊互信的可貴，也是我一直努力實踐的處事態度。」`;
        }
      }

      // 2. 個人特質、興趣與自介類
      if (t.includes('興趣') || t.includes('優點') || t.includes('介紹') || t.includes('自己') || t.includes('hobby') || t.includes('strength') || t.includes('introduce')) {
        if (isEnglish) {
          return `📌 【Recommended Structure (PREP Model)】:\n• Point: Highlight your strongest personality trait or main hobby.\n• Reason: Explain why this trait helps you grow.\n• Example: Give a real primary school activity example.\n• Point: Express your desire to contribute to secondary school.\n\n📝 【${band} High-Score Sample Answer】:\n"Good morning teachers. Regarding '${title}', my greatest strength is my proactive attitude toward learning and active participation in extracurriculars. As a member of our school's robotics team, I spent months practicing coding and debugging under tight schedules. This experience honed my logical thinking and resilience. I am eager to apply these skills to secondary school academics and student society activities."`;
        } else {
          return `📌 【推薦答題結構 (STAR 原則)】：\n• S (情境)：開門見山點出自己的核心優點或特別興趣。\n• T (任務)：說明在小學活動中如何展現這項特質。\n• A (行動)：分享具體實踐過程與付出的努力。\n• R (結果)：最後獲得的成長與對中學生活的期望。\n\n📝 【${band} 高分作答範例】：\n「各位面試官老師好！針對『${title}』這個題目，我的核心優點是具備強烈的自主學習熱情與良好的時間管理能力。以小學六年為例，我除了維持優異學業外，還擔任學校風紀隊長與合唱團成員。在籌備畢業音樂會期間，我每天列出優先順序清單，既保證了練習時間，也按時完成功課。這份自律與熱誠，讓我能從容應對各種挑戰，我也非常期待將這份積極態度帶入貴校。」`;
        }
      }

      // 3. 學科與學校生活類
      if (t.includes('科目') || t.includes('課程') || t.includes('規則') || t.includes('獎學金') || t.includes('subject') || t.includes('rule') || t.includes('scholarship')) {
        if (isEnglish) {
          return `📌 【Recommended Structure (PREP Model)】:\n• Point: Clearly express your choice or idea.\n• Reason: Provide solid logical arguments.\n• Example: Cite a relevant classroom or school experience.\n• Point: Link to your future academic goals.\n\n📝 【${band} High-Score Sample Answer】:\n"Thank you for asking. Concerning '${title}', I believe that curiosity is the biggest driver in learning. For instance, in our Mathematics classes, I love exploring multiple methods to solve a single complex problem rather than just memorizing formulas. This analytical mindset not only boosted my academic confidence but also taught me to approach challenges from different angles, which will prepare me well for secondary school curriculum."`;
        } else {
          return `📌 【推薦答題結構 (STAR 原則)】：\n• S (情境)：直接回應題目主張或選擇。\n• T (任務)：說明該領域或學科帶給你的啟發與挑戰。\n• A (行動)：分享你如何主動探索與深入研習。\n• R (結果)：總結這對你未來中學學習的幫助。\n\n📝 【${band} 高分作答範例】：\n「各位面試官老師好！關於『${title}』這個課題，我的看法是：探究知識的過程比單純獲得答案更重要。以我學習科學科的經驗為例，我們在做植物光合作用實驗時遇到了實驗結果不標準的問題。我沒有直接抄寫課本結論，而是主動查閱資料並重新調配光照時間，最終獲得精準數據。這種求真嚴謹的學習態度，是我認為在中學階段繼續進步的關鍵。」`;
        }
      }

      // 4. 挫敗與克服困難類
      if (t.includes('困難') || t.includes('挫敗') || t.includes('失敗') || t.includes('克服') || t.includes('difficult') || t.includes('problem') || t.includes('challenge')) {
        if (isEnglish) {
          return `📌 【Recommended Structure (PREP Model)】:\n• Point: State your main belief in tackling hardship.\n• Reason: Explain the role of teamwork and resilience.\n• Example: Detail a time a school project hit a bottleneck.\n• Point: Show how you overcome obstacles.\n\n📝 【${band} High-Score Sample Answer】:\n"Thank you for this question. Regarding '${title}', I believe staying calm and fostering open communication are key to solving any crisis. During our science exhibition last term, our group's model collapsed right before judging. As team leader, I quickly assigned tasks, focused on rebuilding the base, and encouraged everyone. In the end, we passed the evaluation smoothly. This taught me that challenges are opportunities to grow."`;
        } else {
          return `📌 【推薦答題結構 (STAR 原則)】：\n• S (情境)：點出面對『${title}』時的核心態度。\n• T (任務)：說明當時團隊或個人面臨的緊迫困境。\n• A (行動)：具體說明採取的解決步驟（冷靜分析、分工、溝通）。\n• R (結果)：獲得的成果與心態上的突破。\n\n📝 【${band} 高分作答範例】：\n「各位面試官老師好！針對『${title}』這個題目，我的看法是：保持積極主動與同理心溝通，是克服困難的關鍵。以小六專題研習為例，當時組員意見分歧且時間緊迫。我主動擔任協調者，建議大家列表分析方案優缺點並投票決定。最終我們按時完成報告並獲得好評。這次經歷讓我明白冷靜溝通比執著個人意見更重要。」`;
        }
      }

      // 5. 通用/其他題目類
      if (isEnglish) {
        return `📌 【Recommended Structure (PREP Model)】:\n• Point: Express a clear and confident perspective on "${title}".\n• Reason: Elaborate with logical reasoning.\n• Example: Connect with personal school life experience.\n• Point: Summarize with positive ambition.\n\n📝 【${band} High-Score Sample Answer】:\n"Thank you for asking this thought-provoking question about '${title}'. From my perspective, maintaining an open mind and a strong sense of responsibility is crucial. Throughout my primary school years, whether serving as a class monitor or working on group assignments, I always aimed to listen attentively and execute tasks diligently. I am eager to bring this enthusiastic mindset to your esteemed school."`;
      } else {
        return `📌 【推薦答題結構 (STAR 原則)】：\n• S (情境)：開門見山發表對「${title}」的核心觀點。\n• T (任務)：說明該議題背後的思考重點或學習價值。\n• A (行動)：結合個人在小學生活或課外活動中的實際體會。\n• R (結果)：總結回答，展現升讀中學的自信與期待。\n\n📝 【${band} 高分作答範例】：\n「各位面試官老師好！針對『${title}』這個題目，我的核心看法是：保持開放思考與責任感是處理問題的基礎。在小學擔任班長及參與各類校園活動的過程中，我養成了仔細聽取他人意見並果斷執行的習慣。這段歷練培養了我的邏輯表達能力與團隊合作精神，我也期待將這份熱忱帶入貴校的中學生活。」`;
      }
    }

    function teacherGenerateAiAnswer() {
      const title = document.getElementById('qTitleInput').value.trim();
      const band = document.getElementById('qBand').value;
      const lang = document.getElementById('qLang').value;
      const btn = document.getElementById('teacherAiGenBtn');

      if (!title) {
        alert("請先輸入題目內容，AI 才能為您生成建議答案！");
        return;
      }

      btn.innerText = "生成中...";
      setTimeout(() => {
        const generatedText = generateDetailedSample(title, band, lang === "English");
        document.getElementById('qDescInput').value = generatedText;
        btn.innerHTML = `<i data-lucide="sparkles" class="w-3 h-3"></i> AI 生成詳細參考答案`;
        lucide.createIcons();
      }, 600);
    }

    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        document.getElementById('micBtn').disabled = true;
        document.getElementById('micBtnText').innerText = '瀏覽器不支援語音';
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'zh-HK';

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          transcript += event.results[i][0].transcript;
        }
        document.getElementById('studentAnswer').value = transcript;
      };

      recognition.onerror = () => stopVoiceRecognition();
      recognition.onend = () => stopVoiceRecognition();
    }

    function toggleVoiceRecognition() {
      if (!recognition) {
        alert('您的瀏覽器不支援 Web Speech 語音輸入，請嘗試使用 Google Chrome 或 Edge 瀏覽器。');
        return;
      }

      if (isRecording) {
        recognition.stop();
        stopVoiceRecognition();
      } else {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ audio: true })
            .then(() => startListening())
            .catch(() => alert('無法獲取麥克風權限！請確定瀏覽器授權選項已開啓。'));
        } else {
          startListening();
        }
      }
    }

    function startListening() {
      if (currentQKey && questions[currentQKey] && questions[currentQKey].lang === 'English') {
        recognition.lang = 'en-US';
      } else {
        recognition.lang = 'zh-HK';
      }
      try {
        recognition.start();
        isRecording = true;
        document.getElementById('micBtn').classList.add('recording-pulse');
        document.getElementById('micBtnText').innerText = '聆聽中... (點擊停止)';
      } catch (e) {}
    }

    function stopVoiceRecognition() {
      isRecording = false;
      document.getElementById('micBtn').classList.remove('recording-pulse');
      document.getElementById('micBtnText').innerText = '語音輸入';
    }

    function clearAnswer() {
      document.getElementById('studentAnswer').value = '';
    }

    function submitAnswerForAI() {
      const ans = document.getElementById('studentAnswer').value.trim();
      if (!ans) {
        alert('請先輸入或語音錄製答案！');
        return;
      }

      const q = questions[currentQKey];
      const resultBox = document.getElementById('aiResultBox');
      const content = document.getElementById('aiFeedbackContent');

      resultBox.classList.remove('hidden');
      content.innerText = '⏳ AI 面試官正在進行多維度深度語意比對與內容分析，請稍候...';

      setTimeout(() => {
        const isEnglish = q.lang === "English";
        const titleLower = q.title.toLowerCase();
        const ansLower = ans.toLowerCase();

        const isTooShort = ans.length < 10;
        const isGibberish = /^[a-zA-Z0-9\s]+$/.test(ans) && !ans.includes(" ") && ans.length > 3;
        const isRefusal = ans.includes("不知道") || ans.includes("冇") || ans.includes("無") || ans.includes("don't know") || ans.includes("no idea");

        const sampleText = generateDetailedSample(q.title, q.band, isEnglish);

        if (isTooShort || isGibberish || isRefusal) {
          content.innerText = isEnglish
            ? `🟢 Strengths:\n• Entered a response in the text area.\n\n🔴 Areas for Improvement:\n• The answer is too brief, nonsensical, or states a refusal to answer.\n• Failing to address "${q.title}" with meaningful content shows a lack of preparation.\n\n💡 Suggestions & High-Score Sample Answer:\n${sampleText}`
            : `🟢 優點 (Strengths)：\n• 學生嘗試進行了輸入作答。\n\n🔴 缺點與改進空間 (Areas for Improvement)：\n• 回答內容過短（未滿10字）、含有無意義字元或屬於拒絕回答（如「不知道」）。\n• 完全未針對題目「${q.title}」展開說明，在升中面試中會被扣減態度分數。\n\n💡 具體建議與針對本題的高分作答例子：\n${sampleText}`;
          return;
        }

        const keywordSets = [
          { keys: ["興趣", "優點", "自介", "介紹", "hobby", "strength", "introduce", "myself"], topic: "個人特質" },
          { keys: ["書", "閱讀", "喜歡", "作者", "主角", "book", "read", "author", "story"], topic: "閱讀心得" },
          { keys: ["困難", "挫敗", "挑戰", "解決", "克服", "difficult", "problem", "solve", "challenge"], topic: "解決問題能力" },
          { keys: ["組員", "合作", "小組", "團隊", "分工", "team", "group", "collaborate", "peer"], topic: "團隊合作" },
          { keys: ["科目", "學科", "最喜愛", "數學", "英文", "中文", "科學", "subject", "favorite", "math", "english", "science"], topic: "學科興趣" }
        ];

        let matchedTopic = "";
        keywordSets.forEach(set => {
          if (set.keys.some(k => titleLower.includes(k))) matchedTopic = set.topic;
        });

        let hasRelevantWords = true;
        if (matchedTopic) {
          const currentSet = keywordSets.find(s => s.topic === matchedTopic);
          hasRelevantWords = currentSet.keys.some(k => ansLower.includes(k));
        }

        const exampleWords = ["例如", "記得有一次", "上學期", "經驗", "經驗是", "曾經", "例子", "for example", "instance", "last year", "experience", "when i"];
        const hasExample = exampleWords.some(w => ansLower.includes(w));

        const logicWords = ["因為", "所以", "此外", "總括而言", "第一", "第二", "但是", "therefore", "because", "besides", "however", "in conclusion"];
        const hasLogic = logicWords.some(w => ansLower.includes(w));

        let strengths = [];
        let weaknesses = [];

        if (isEnglish) {
          if (hasRelevantWords) strengths.push(`• Directly addresses the core topic of "${q.title}".`);
          else weaknesses.push(`• Your answer lacks key vocabulary directly related to "${q.title}". It feels slightly off-topic.`);

          if (ans.length > 50) strengths.push(`• Good overall response length, demonstrating effort in elaboration.`);
          else weaknesses.push(`• The answer length is a bit short. Aim for at least 3-4 full sentences.`);

          if (hasExample) strengths.push(`• Great job supporting your opinion with specific personal experiences or examples!`);
          else weaknesses.push(`• Missing specific personal stories or concrete examples to back up your points.`);

          if (hasLogic) strengths.push(`• Well-structured sentence organization using logical connectors.`);
          else weaknesses.push(`• Sentence structures could be improved by using connective words (e.g., 'Because', 'Therefore', 'For instance').`);

        } else {
          if (hasRelevantWords) strengths.push(`• 回答緊扣題目「${q.title}」的核心主題，沒有離題。`);
          else weaknesses.push(`• 答案中缺少與「${q.title}」直接相關的核心關鍵詞，給人偏題或套用通用模板的感覺。`);

          if (ans.length >= 40) strengths.push(`• 作答篇幅充實（已達 ${ans.length} 字），展現了良好的答題誠意與表達意願。`);
          else weaknesses.push(`• 字數稍顯不足（目前僅 ${ans.length} 字），建議補充更多細節，使回答擴充至 3-4 句完整句子。`);

          if (hasExample) strengths.push(`• 非常優秀！能夠運用「例如/記得有一次」等具體個人經歷來支持觀點，大幅增加說服力。`);
          else weaknesses.push(`• 缺乏具體的個人生活事例或學習經驗支撐，使回答顯得較為空洞泛談。`);

          if (hasLogic) strengths.push(`• 邏輯層次分明，能夠善用「因為、所以、此外」等連接詞結構化表達。`);
          else weaknesses.push(`• 句式結構較為單一，建議多使用關聯詞（如：第一……此外……總括來說……）強化條理性。`);
        }

        let finalOutput = "";
        if (isEnglish) {
          finalOutput = `🟢 Strengths:\n${strengths.join("\n") || "• Attempted to answer in English."}\n\n🔴 Areas for Improvement:\n${weaknesses.join("\n") || "• Minor adjustments needed for better vocabulary fluency."}\n\n💡 Suggestions & High-Score Sample Answer:\n${sampleText}`;
        } else {
          finalOutput = `🟢 優點 (Strengths)：\n${strengths.join("\n") || "• 具備基本答題意願。"}\n\n🔴 缺點與改進空間 (Areas for Improvement)：\n${weaknesses.join("\n") || "• 表達流暢，可進一步深化細節。"}\n\n💡 具體建議與針對本題的高分作答例子：\n${sampleText}`;
        }

        content.innerText = finalOutput;
      }, 1000);
    }

    function toggleModePrompt() {
      if (isTeacher) {
        exitTeacherMode();
      } else {
        document.getElementById('pwdTitle').innerText = '教師身份登入';
        document.getElementById('pwdInput').value = '';
        document.getElementById('pwdModal').classList.remove('hidden');
      }
    }

    function verifyPassword() {
      const val = document.getElementById('pwdInput').value;
      if (val === teacherPassword) {
        isTeacher = true;
        closeModal('pwdModal');
        document.getElementById('studentLoginModal').classList.add('hidden');
        document.getElementById('studentView').classList.add('hidden');
        document.getElementById('teacherView').classList.remove('hidden');
        document.getElementById('modeText').innerText = '退出教師模式';
      } else {
        alert('教師密碼不正確！');
      }
    }

    function exitTeacherMode() {
      isTeacher = false;
      document.getElementById('teacherView').classList.add('hidden');
      checkStudentAuth();
      document.getElementById('modeText').innerText = '教師登入';
    }

    function openPasswordModal() {
      const newPwd = prompt('請輸入新的教師密碼：');
      if (newPwd && newPwd.trim().length > 0) {
        teacherPassword = newPwd.trim();
        if (db) db.ref('teacher_password').set(teacherPassword);
        alert('教師密碼修改成功！');
      }
    }

    function openStudentPasswordModal() {
      const newPwd = prompt('請輸入新的學生登入密碼：', studentPassword);
      if (newPwd && newPwd.trim().length > 0) {
        studentPassword = newPwd.trim();
        if (db) db.ref('student_password').set(studentPassword);
        localStorage.setItem('student_password', studentPassword);
        alert('學生登入密碼修改成功！');
      }
    }

    function openAddModal() {
      document.getElementById('modalTitle').innerText = '新增問題';
      document.getElementById('editKey').value = '';
      document.getElementById('qTitleInput').value = '';
      document.getElementById('qDescInput').value = '';
      document.getElementById('qModal').classList.remove('hidden');
    }

    function editQuestion(key) {
      const q = questions[key];
      document.getElementById('modalTitle').innerText = '編輯問題';
      document.getElementById('editKey').value = key;
      document.getElementById('qBand').value = q.band || 'Band 1';
      document.getElementById('qLang').value = q.lang || '中文';
      document.getElementById('qTitleInput').value = q.title;
      document.getElementById('qDescInput').value = q.desc || '';
      document.getElementById('qModal').classList.remove('hidden');
    }

    function saveQuestion() {
      const key = document.getElementById('editKey').value || `q_${Date.now()}`;
      const title = document.getElementById('qTitleInput').value.trim();
      const desc = document.getElementById('qDescInput').value.trim();
      const band = document.getElementById('qBand').value;
      const lang = document.getElementById('qLang').value;

      if (!title) {
        alert('請輸入題目內容！');
        return;
      }

      questions[key] = { title, desc, band, lang };
      syncQuestions();
      closeModal('qModal');
    }

    function deleteQuestion(key) {
      if (confirm('確定要刪除這道題目嗎？')) {
        delete questions[key];
        syncQuestions();
      }
    }

    function openBatchModal() {
      document.getElementById('batchInput').value = '';
      document.getElementById('batchModal').classList.remove('hidden');
    }

    function generateAiQuestions() {
      const band = document.getElementById('batchBand').value;
      const lang = document.getElementById('batchLang').value;
      const btn = document.getElementById('aiGenBtn');
      
      btn.innerText = '生成中...';
      setTimeout(() => {
        let aiResults = [];
        if (lang === 'English') {
          aiResults = [
            'What is your favorite book and what did you learn from it?',
            'How do you handle stress when preparing for examinations?',
            'If you could change one school rule, what would it be and why?'
          ];
        } else {
          aiResults = [
            '請分享一次你克服困難或挫敗的經驗，並談談你的學習。',
            '如果你有機會設計一堂全新的學校課程，你會想設計什麼主題？',
            '談談你最崇拜的人或榜樣，他對你產生了什麼影響？'
          ];
        }
        document.getElementById('batchInput').value = aiResults.join('\n');
        btn.innerHTML = `<i data-lucide="sparkles" class="w-3.5 h-3.5"></i> AI 生成小六題目`;
        lucide.createIcons();
      }, 1000);
    }

    function saveBatchQuestions() {
      const lines = document.getElementById('batchInput').value.split('\n');
      const band = document.getElementById('batchBand').value;
      const lang = document.getElementById('batchLang').value;

      lines.forEach((line) => {
        const text = line.trim();
        if (text) {
          const key = `q_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
          questions[key] = { title: text, desc: '', band: band, lang: lang };
        }
      });

      syncQuestions();
      closeModal('batchModal');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }
  </script>
</body>
</html>
